name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RIEGEL: keine Nennung der HAW in diesem oeffentlichen Spiegel.
      #
      # WARUM MASCHINELL. Die Auswahlregel ("mkdocs.yml, README.md und
      # .gitignore des Hauptrepos werden nicht uebernommen; keine Verweise auf
      # die HAW, nur auf die CADS AG") stand bis zum 2026-09-24 NUR im
      # Commit-Text und in der README dieses Spiegels - also nirgends, wo eine
      # Maschine sie haette durchsetzen koennen. Am 2026-09-24 gemessen war der
      # Spiegel sauber, die QUELLE im privaten Repo aber nicht: dort standen
      # weiter "Anmelden mit HAW GitLab" und "HAW-GitLab-Account"
      # (reference/remote-desktop-riisc.md, -rn-praktikum.md, umgebung.md).
      # Nur weil jemand den Spiegel von Hand gesaeubert hatte, fiel es nicht
      # auf; der naechste Abgleich haette die Nennung zurueckgeholt.
      #
      # Dieser Schritt laeuft VOR dem Bau: schlaegt er an, wird nichts
      # veroeffentlicht.
      - name: Riegel - keine HAW-Nennung im Spiegel
        run: |
          treffer=$(grep -rInE '\bHAW\b|\bHamburg\b|haw-hamburg|informatik\.haw' \
            --include='*.md' --include='*.yml' --include='*.yaml' --include='*.txt' \
            docs/ mkdocs.yml README.md 2>/dev/null || true)
          anzahl=$(printf '%s\n' "$treffer" | grep -c . || true)
          echo "HAW-Treffer: $anzahl (Soll: 0)"
          if [ "$anzahl" -ne 0 ]; then
            echo "$treffer"
            echo "FEHLER: Dieser Spiegel darf die HAW nicht nennen, nur die CADS AG."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build

      # PDF-Erzeugung. Jedes Aufgabenblatt traegt oben einen Knopf "Als PDF
      # herunterladen" auf ../pdf/<slug>.pdf. Bis zum 2026-09-24 gab es dieses
      # Verzeichnis hier nicht: ALLE SIEBEN Knoepfe lieferten HTTP 404, und im
      # Repo existierte kein einziger pdf-Pfad. Das private Repo rendert die
      # PDFs in seinem eigenen Workflow (docs-site.yml) per Playwright aus der
      # gebauten Site; dieser Spiegel machte nur `mkdocs build` und kannte den
      # Schritt nicht.
      #
      # Kein LaTeX/Pandoc: Playwright druckt die bereits gebauten HTML-Seiten,
      # die PDFs entsprechen damit immer genau dem veroeffentlichten Text.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright bereitstellen
        run: npm init -y >/dev/null && npm i -D @playwright/test@^1.49.0 && npx playwright install --with-deps chromium
      - name: PDFs aus der gebauten Site rendern
        # Die Basis-URL ist Pflicht: beim Druck aus einer file://-Quelle
        # schreibt Chromium sonst file:///home/runner/work/...-Pfade als
        # Linkziele in jedes PDF (toter Link + Offenlegung des Build-Pfads).
        env:
          PDF_BASE_URL: https://scimbe.github.io/CADS-praktikum-docs/
        run: node scripts/render-lab-pdfs.mjs "$(pwd)/site"
      - name: Gegenprobe - Anzahl, Knopf-Ziel und Linkziele der PDFs
        run: |
          anzahl=$(find site -name '*.pdf' | wc -l)
          echo "PDFs erzeugt: $anzahl"
          test "$anzahl" -eq 14 || { echo "FEHLER: 14 PDFs erwartet (7 Blaetter x DE/EN), gefunden $anzahl"; exit 1; }
          find site -name '*.pdf' -printf '  %p  %s Byte\n'

          # Der Knopf muss auf eine Datei zeigen, die es gibt. Bis 2026-09-24
          # verlinkte er ../pdf/<slug>.pdf und traf damit /labs/pdf/<slug>.pdf
          # - alle sieben Knoepfe lieferten HTTP 404. Geprueft wird deshalb
          # das href der gebauten Seite, nicht eine geratene URL.
          fehler=0
          for seite in site/labs/*/index.html site/en/labs/*/index.html; do
            verzeichnis=$(dirname "$seite")
            ziel=$(grep -oE 'href="[^"]*\.pdf"' "$seite" | head -1 | sed 's/href="//; s/"$//')
            test -n "$ziel" || { echo "FEHLER: kein PDF-Knopf in $seite"; fehler=1; continue; }
            aufgeloest=$(realpath -m "$verzeichnis/$ziel")
            if [ -f "$aufgeloest" ]; then
              echo "  OK    $seite -> $ziel"
            else
              echo "  FEHLT $seite -> $ziel (aufgeloest: $aufgeloest)"
              fehler=1
            fi
          done

          # Kein Build-Pfad in den Linkzielen.
          if grep -rlU 'file:///home/runner' site --include='*.pdf' | head -1 | grep -q .; then
            echo "FEHLER: file://-Build-Pfad als Linkziel in mindestens einem PDF"
            grep -rlU 'file:///home/runner' site --include='*.pdf'
            fehler=1
          fi

          # Kein roher Icon-Shortcode im ausgelieferten HTML.
          if grep -rl ':material-file-pdf-box:' site --include='*.html' | head -1 | grep -q .; then
            echo "FEHLER: roher Shortcode :material-file-pdf-box: im HTML"
            grep -rl ':material-file-pdf-box:' site --include='*.html'
            fehler=1
          fi

          test "$fehler" -eq 0 || exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
