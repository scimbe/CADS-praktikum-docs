name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RIEGEL: keine Nennung der HAW in diesem oeffentlichen Spiegel.
      #
      # WARUM MASCHINELL. Die Auswahlregel ("mkdocs.yml, README.md und
      # .gitignore des Hauptrepos werden nicht uebernommen; keine Verweise auf
      # die HAW, nur auf die CADS AG") stand bis zum 2026-09-24 NUR im
      # Commit-Text und in der README dieses Spiegels - also nirgends, wo eine
      # Maschine sie haette durchsetzen koennen. Am 2026-09-24 gemessen war der
      # Spiegel sauber, die QUELLE im privaten Repo aber nicht: dort standen
      # weiter "Anmelden mit HAW GitLab" und "HAW-GitLab-Account"
      # (reference/remote-desktop-riisc.md, -rn-praktikum.md, umgebung.md).
      # Nur weil jemand den Spiegel von Hand gesaeubert hatte, fiel es nicht
      # auf; der naechste Abgleich haette die Nennung zurueckgeholt.
      #
      # Dieser Schritt laeuft VOR dem Bau: schlaegt er an, wird nichts
      # veroeffentlicht.
      - name: Riegel - keine HAW-Nennung im Spiegel
        run: |
          treffer=$(grep -rInE '\bHAW\b|\bHamburg\b|haw-hamburg|informatik\.haw' \
            --include='*.md' --include='*.yml' --include='*.yaml' --include='*.txt' \
            docs/ mkdocs.yml README.md 2>/dev/null || true)
          anzahl=$(printf '%s\n' "$treffer" | grep -c . || true)
          echo "HAW-Treffer: $anzahl (Soll: 0)"
          if [ "$anzahl" -ne 0 ]; then
            echo "$treffer"
            echo "FEHLER: Dieser Spiegel darf die HAW nicht nennen, nur die CADS AG."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build

      # PDF-Erzeugung. Jedes Aufgabenblatt traegt oben einen Knopf "Als PDF
      # herunterladen" auf ../pdf/<slug>.pdf. Bis zum 2026-09-24 gab es dieses
      # Verzeichnis hier nicht: ALLE SIEBEN Knoepfe lieferten HTTP 404, und im
      # Repo existierte kein einziger pdf-Pfad. Das private Repo rendert die
      # PDFs in seinem eigenen Workflow (docs-site.yml) per Playwright aus der
      # gebauten Site; dieser Spiegel machte nur `mkdocs build` und kannte den
      # Schritt nicht.
      #
      # Kein LaTeX/Pandoc: Playwright druckt die bereits gebauten HTML-Seiten,
      # die PDFs entsprechen damit immer genau dem veroeffentlichten Text.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright bereitstellen
        run: npm init -y >/dev/null && npm i -D @playwright/test@^1.48.0 && npx playwright install --with-deps chromium
      - name: PDFs aus der gebauten Site rendern
        run: node scripts/render-lab-pdfs.mjs "$(pwd)/site"
      - name: Gegenprobe - es muss mindestens ein PDF entstanden sein
        run: |
          anzahl=$(find site -name '*.pdf' | wc -l)
          echo "PDFs erzeugt: $anzahl"
          test "$anzahl" -ge 1 || { echo "FEHLER: kein PDF erzeugt"; exit 1; }
          find site -name '*.pdf' -printf '  %p  %s Byte\n'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
