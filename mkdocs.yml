          - "Meilenstein 2 · DoH, TLS-Fingerprints und die Uhr": labs/06-advanced-covert-channels/m2-doh-ja3-zeit.md
          - "Meilenstein 3 · Kanäle selbst bauen": labs/06-advanced-covert-channels/m3-kanaele-selbst-bauen.md
          - "Meilenstein 4 · Weitere Träger und Erkennung": labs/06-advanced-covert-channels/m4-weitere-traeger-und-erkennung.md
