          - "Meilenstein 2 · SYN-Flood": labs/05-arp-spoofing-dos/m2-syn-flood.md
          - "Meilenstein 3 · Erkennen, messen, verteidigen": labs/05-arp-spoofing-dos/m3-verteidigen.md
      - "06 · Advanced: Covert Channels":
