site_name: Rechnernetze-Praktikum
site_description: >-
  Praktikumsaufgaben und Referenzdokumentation der modernisierten
  Rechnernetze-Praktikumsumgebung.
site_url: https://scimbe.github.io/CADS-praktikum-docs/
docs_dir: docs
copyright: "&copy; 2026 CADS AG"

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus aktivieren
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Hellmodus aktivieren
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.suggest

plugins:
  - search
  - glightbox:
      auto_caption: true
      caption_position: bottom
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          name: Deutsch
          build: true
          default: true
        # Englisch aus (CTO 2026-11-21): uebersetzt war nur die Startseite.
        - locale: en
          name: English
          build: false
          nav_translations:
            Start: Home
            Praktika: Labs
            Referenz: Reference

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # line_spans: jede Codezeile in eigenem <span>, damit copy-strip-prompt.js
  # je Befehlszeile einen eigenen Kopierknopf anbieten kann.
  - pymdownx.highlight:
      line_spans: __span
  - pymdownx.inlinehilite
  # Ohne pymdownx.emoji bleibt ":material-file-pdf-box:" aus den
  # Aufgabenblaettern als roher Text stehen - sichtbar auf allen sieben
  # Seiten und in allen sieben PDFs (gemessen 2026-09-24).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - pymdownx.keys
  - toc:
      permalink: true
  # Fuer den wiederverwendbaren Verbesserungslink-Baustein
  # (docs/.snippets/issue-feedback.md), damit der Linktext nicht in jeder
  # Datei von Hand gepflegt werden muss.
  - pymdownx.snippets:
      base_path:
        - docs/.snippets
      check_paths: true

extra_javascript:
  - assets/js/issue-feedback.js
  - assets/js/copy-strip-prompt.js

nav:
  - Start: index.md
  - Praktika:
      - "01 · Netzwerkgrundlagen & Tools":
          - labs/01-netzwerkgrundlagen-tools/index.md
          - "Meilenstein 1 · Schichten im echten Verkehr": labs/01-netzwerkgrundlagen-tools/m1-schichten-im-echten-verkehr.md
          - "Meilenstein 2 · Werkzeuge in der emulierten Topologie": labs/01-netzwerkgrundlagen-tools/m2-werkzeuge-in-topo01.md
          - "Meilenstein 3 · Dienste selbst betreiben und belauschen": labs/01-netzwerkgrundlagen-tools/m3-dienste-selbst-betreiben.md
      - "02 · IPv4-Subnetting & ARP":
          - labs/02-subnetting-arp/index.md
          - "Meilenstein 1 · Mininet und die Netzwerkwerkzeuge": labs/02-subnetting-arp/m1-werkzeuge.md
          - "Meilenstein 2 · Adressplan: VLSM, Konfiguration, MTU, Broadcast": labs/02-subnetting-arp/m2-adressplan.md
          - "Meilenstein 3 · Switch und ARP": labs/02-subnetting-arp/m3-switch-und-arp.md
          - "Meilenstein 4 · Vertiefung: Präfixe, IPv6, Flutung, Verschnitt": labs/02-subnetting-arp/m4-vertiefung.md
      - "03 · Routing (RIP/BGP)":
