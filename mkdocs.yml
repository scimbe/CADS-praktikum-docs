          - "Meilenstein 1 · Manuelles Routing": labs/03-routing-rip-bgp/m1-manuelles-routing.md
          - "Meilenstein 2 · Dynamisches Routing mit RIP und BGP": labs/03-routing-rip-bgp/m2-rip-und-bgp.md
          - "Meilenstein 3 · Rekonvergenz und Protokollspuren messen": labs/03-routing-rip-bgp/m3-rekonvergenz-und-spuren.md
          - "Meilenstein 4 · Tabellen, AS-Pfad, Metrik und Nachrichten lesen": labs/03-routing-rip-bgp/m4-tabellen-und-nachrichten.md
      - "04 · TCP/UDP & Congestion Control":
          - labs/04-tcp-udp-congestion/index.md
          - "Meilenstein 1 · Fehlerrate, MTU und Fragmentierung": labs/04-tcp-udp-congestion/m1-fehlerrate-mtu.md
          - "Meilenstein 2 · Durchsatz und Staukontrolle": labs/04-tcp-udp-congestion/m2-durchsatz-und-staukontrolle.md
